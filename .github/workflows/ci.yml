name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, migrations, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tiba
          POSTGRES_PASSWORD: tiba
          POSTGRES_DB: tibadirect
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tiba -d tibadirect"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      APP_ENV: development
      DATA_ENCRYPTION_KEY: ZGV2LW9ubHkta2V5LWRvLW5vdC11c2UtaW4tcHJvZCE=
      DATABASE_URL: postgresql+psycopg://tiba:tiba@localhost:5432/tibadirect
      TEST_DATABASE_URL: postgresql+psycopg://tiba:tiba@localhost:5432/tibadirect_test
      REDIS_URL: redis://localhost:6379/0
      PAYPAL_MODE: mock
      LLM_API_KEY: ""
      PGPASSWORD: tiba

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr poppler-utils

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Create the test database
        run: psql -h localhost -U tiba -d tibadirect -c "CREATE DATABASE tibadirect_test"

      # This database is thrown away with the job, so it need not survive a crash. Not waiting for
      # the disk on every commit and index build makes the test run several times faster.
      - name: Make the throwaway database fast
        run: >-
          psql -h localhost -U tiba -d tibadirect
          -c "ALTER SYSTEM SET fsync = off"
          -c "ALTER SYSTEM SET synchronous_commit = off"
          -c "ALTER SYSTEM SET full_page_writes = off"
          -c "SELECT pg_reload_conf()"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Migrations run up, down and up again on an empty database
        run: |
          flask --app wsgi db upgrade
          flask --app wsgi db downgrade base
          flask --app wsgi db upgrade

      - name: Seed data loads and resets
        env:
          DEMO_BANNER: "true"
        run: |
          flask --app wsgi seed
          flask --app wsgi reset-demo --yes

      - name: The appeal classifier trains and scores the held-out messages
        run: flask --app wsgi ai train-appeals --out "$RUNNER_TEMP/appeal_clf.joblib"

      - name: The evaluation runs against the synthetic set
        run: |
          flask --app wsgi ai evaluate --out "$RUNNER_TEMP/REPORT.md"
          head -20 "$RUNNER_TEMP/REPORT.md"

      # One worker per CPU; each worker makes and uses its own database (tests/conftest.py).
      - name: Tests with coverage
        run: pytest -n auto --cov=app --cov-fail-under=75

      - name: Slow tests (dataset reproducibility)
        run: pytest -m slow

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: The generated API types match the committed OpenAPI document
        run: |
          npx openapi-typescript ../docs/api/openapi.json -o "$RUNNER_TEMP/schema.d.ts"
          diff -q "$RUNNER_TEMP/schema.d.ts" src/api/schema.d.ts

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: End-to-end (browser flows on the local stack)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [backend, frontend]

    # The same stack a developer runs locally: Postgres, Redis, storage and a mail catcher from
    # docker-compose.yml, the API, a worker and the scheduler as processes, and the web app's dev server.
    # PayPal is the built-in simulation, so the donation button needs no keys and no network.
    env:
      APP_ENV: development
      DATA_ENCRYPTION_KEY: ZGV2LW9ubHkta2V5LWRvLW5vdC11c2UtaW4tcHJvZCE=
      DATABASE_URL: postgresql+psycopg://tiba:tiba@localhost:5432/tibadirect
      REDIS_URL: redis://localhost:6379/0
      PAYPAL_MODE: mock
      LLM_API_KEY: ""
      DEMO_BANNER: "true"
      E2E_BASE_URL: http://localhost:5173
      E2E_BROWSER_CHANNEL: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr poppler-utils

      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt

      - name: Start the infrastructure
        run: |
          docker compose up -d --wait postgres redis minio mailpit
          docker compose run --rm minio-init

      - name: Create the tables and the demo data
        working-directory: backend
        run: |
          flask --app wsgi db upgrade
          flask --app wsgi seed

      - name: Start the API, the worker and the scheduler
        working-directory: backend
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          nohup flask --app wsgi run --port 5000 > "$RUNNER_TEMP/logs/api.log" 2>&1 &
          nohup python -m app.jobs.worker > "$RUNNER_TEMP/logs/worker.log" 2>&1 &
          nohup python -m app.jobs.scheduler > "$RUNNER_TEMP/logs/scheduler.log" 2>&1 &
          for attempt in $(seq 1 30); do curl -fs localhost:5000/api/health && break; sleep 2; done

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the web app and a browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start the web app
        working-directory: frontend
        run: |
          nohup npm run dev > "$RUNNER_TEMP/logs/web.log" 2>&1 &
          for attempt in $(seq 1 30); do curl -fs localhost:5173 > /dev/null && break; sleep 2; done

      # The long walkthrough (e2e/mvp-flow.spec.ts) stays a manual run; it is the Phase 4 review's tour.
      - name: Browser flows, accessibility and phone-size checks
        working-directory: frontend
        run: npx playwright test e2e/flows e2e/accessibility.spec.ts e2e/responsive.spec.ts

      - name: Keep the reports and logs when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure
          path: |
            frontend/playwright-report
            frontend/test-results
            ${{ runner.temp }}/logs
          retention-days: 7

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pinned so CI scans with exactly the version the config was verified against.
          GITLEAKS_VERSION: "8.24.3"
          # Findings fail the job and appear in the job summary and the SARIF artifact; commenting
          # on the pull request would need write permission this workflow does not grant.
          GITLEAKS_ENABLE_COMMENTS: "false"
