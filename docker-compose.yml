# Local infrastructure for TibaDirect: Postgres, Redis, MinIO and Mailpit, plus the application
# services (api, worker, scheduler) under the "app" profile: docker compose --profile app up -d --build
# Host ports are configurable through .env because other services may already hold the defaults.
name: tibadirect

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tiba
      POSTGRES_PASSWORD: tiba
      POSTGRES_DB: tibadirect
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tiba -d tibadirect"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # MinIO's own images left Docker Hub in September 2026; Chainguard publishes free rebuilds
  # of the same server (with the mc client inside), which also serve the bucket bootstrap below.
  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-tibadirect-dev}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-tibadirect-dev-secret}
    ports:
      - "127.0.0.1:${MINIO_API_HOST_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: creates the private upload bucket, then exits.
  minio-init:
    image: cgr.dev/chainguard/minio:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-tibadirect-dev}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-tibadirect-dev-secret}
      S3_BUCKET: ${S3_BUCKET:-tibadirect-uploads}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$S3_ACCESS_KEY_ID $$S3_SECRET_ACCESS_KEY &&
      mc mb --ignore-existing local/$$S3_BUCKET &&
      mc anonymous set none local/$$S3_BUCKET
      "
    restart: "no"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_HOST_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_HOST_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- Application services (profile "app"). One image; the commands differ. ---
  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    image: tibadirect-app
    env_file:
      - path: .env
        required: false
    environment: &app-env
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://tiba:tiba@postgres:5432/tibadirect
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:${MINIO_API_HOST_PORT:-9000}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SERVE_SPA: "true"
    command: >
      sh -c "flask --app wsgi db upgrade &&
      exec flask --app wsgi run --host 0.0.0.0 --port 5000"
    ports:
      - "127.0.0.1:${API_HOST_PORT:-5000}:5000"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
      mailpit: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:5000/api/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    profiles: ["app"]
    image: tibadirect-app
    env_file:
      - path: .env
        required: false
    environment: *app-env
    command: ["python", "-m", "app.jobs.worker"]
    depends_on:
      api: {condition: service_healthy}

  scheduler:
    profiles: ["app"]
    image: tibadirect-app
    env_file:
      - path: .env
        required: false
    environment: *app-env
    command: ["python", "-m", "app.jobs.scheduler"]
    depends_on:
      api: {condition: service_healthy}

volumes:
  postgres_data:
  redis_data:
  minio_data:
