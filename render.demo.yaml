# Free demo Blueprint: everything on Render's free plans. One web service also runs the worker and
# the scheduler (free plans have no background workers). Bills go to a private Cloudflare R2 bucket
# and sign-in codes show on screen (DEMO_SHOW_LOGIN_CODE), so judges can use the made-up demo
# accounts. The demo world is seeded on the first start. Not for
# real patients: render.yaml is the production setup.
services:
  - type: web
    name: tibadirect
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    # Migrate, seed once, start the worker and the scheduler, then serve (backend/scripts).
    dockerCommand: sh scripts/demo_start.sh
    envVars:
      - key: APP_ENV
        value: production
      - key: DEMO_BANNER
        value: "true"
      - key: DEMO_SHOW_LOGIN_CODE
        value: "true"
      # Render's free plan blocks outgoing SMTP ports (25, 465, 587), so Gmail cannot be reached
      # from here: mail stays off and codes show on screen. The SMTP settings below are ready
      # for a paid plan or a relay on another port.
      - key: MAIL_BACKEND
        value: "off"
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        value: tibadirect@gmail.com
      - key: MAIL_FROM
        value: tibadirect@gmail.com
      - key: SMTP_PASSWORD
        sync: false
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_ENDPOINT_URL
        value: https://f24628c7e047d706a0f9eadecbb6a0aa.r2.cloudflarestorage.com
      - key: S3_BUCKET
        value: tibadirect-uploads
      - key: S3_REGION
        value: auto
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      # "true" for one start wipes the data and loads the demo world again (read by demo_start.sh).
      - key: DEMO_RESET_ON_START
        sync: false
      - key: PAYPAL_MODE
        value: sandbox
      - key: AGENT_ENABLED
        value: "false"
      - key: PROXY_FIX_COUNT
        value: "1"
      - key: JOBS_ASYNC
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: tibadirect-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: tibadirect-redis
          property: connectionString
      - key: APP_BASE_URL
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_COLLECTOR_EMAIL
        sync: false
      - key: SEED_HOSPITAL_PAYOUT_EMAILS
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: HASH_PEPPER
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        generateValue: true

  - type: keyvalue
    name: tibadirect-redis
    plan: free
    region: frankfurt
    ipAllowList: []
    maxmemoryPolicy: noeviction

databases:
  - name: tibadirect-db
    databaseName: tibadirect
    user: tiba
    plan: free
    region: frankfurt
